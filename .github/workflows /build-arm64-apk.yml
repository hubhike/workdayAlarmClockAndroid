name: 构建 arm64-v8a 版 APK（未签名）

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出项目代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 修改构建配置为仅 arm64-v8a
        run: |
          # 项目原本使用了 productFlavors (full, x86, arm7)
          # 我们直接将 full flavor 的 abiFilters 修改为仅包含 arm64-v8a
          sed -i 's/"armeabi-v7a", "arm64-v8a"/"arm64-v8a"/g' app/build.gradle
          
          echo "=== 验证 abiFilters 修改结果 ==="
          grep -A 3 "full {" app/build.gradle

      - name: 构建 Full Release APK (已限制为 arm64-v8a)
        # 明确指定构建 full 变体的 release 版本
        run: ./gradlew assembleFullRelease

      - name: 查找并列出生成的 APK
        run: |
          echo "=== 检查 app/release 目录 (项目自定义的输出目录) ==="
          ls -lh app/release/ || echo "app/release 目录为空或不存在"
          
          echo "=== 检查默认输出目录 (以防自定义脚本未生效) ==="
          find app/build/outputs/apk -name "*.apk" -type f -exec ls -lh {} \; || echo "默认目录未找到 APK"

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release-unsigned
          # 优先匹配项目自定义的移动后目录，若不存在则匹配默认 flavor 目录
          path: |
            app/release/*.apk
            app/build/outputs/apk/full/release/*.apk
